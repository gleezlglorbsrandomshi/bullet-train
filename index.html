<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title></title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; min-height: 100%; background: #000; }
body { min-height: 2000vh; overflow-x: hidden; overflow-y: auto; }
main {
  position: relative; z-index: 1;
  width: 100%; height: 100vh; min-height: 100vh; display: flex;
  align-items: center; justify-content: space-between;
  padding: 0; gap: 0;
}
img {
  display: block; width: 45vw; height: 100vh;
  object-fit: contain; flex: 0 1 45vw;
}
/* Keep both crossing signs upright and move them away from the roadway. */
main img:first-child { transform: translateX(-4vw); }
main img:last-child { transform: translateX(4vw); }
@media (max-width: 520px) {
  img { width: 36vw; flex-basis: 36vw; height: 80vh; }
  main { padding: 0; gap: 0; }
  main img:first-child { transform: translateX(-14vw); }
  main img:last-child { transform: translateX(14vw); }
}
</style>
<style>
#bottom-train-message {
  position: absolute;
  z-index: 1;
  top: calc(2000vh - 150px);
  left: 0;
  width: 100%;
  box-sizing: border-box;
  padding: 24px 16px 48px;
  color: #f2f2f2;
  text-align: center;
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(16px, 2.4vw, 30px);
  font-weight: 900;
  letter-spacing: 0.04em;
  text-transform: lowercase;
  -webkit-font-smoothing: none;
  text-shadow: 1px 0 #f2f2f2, -1px 0 #f2f2f2, 0 1px #f2f2f2, 0 -1px #f2f2f2;
  image-rendering: pixelated;
  text-rendering: geometricPrecision;
  filter: contrast(1.2);
}
</style>
</head>

<script>
(() => {
  const stopAt = () => Math.max(1, Math.round(window.innerHeight * 19));
  let limit = stopAt();

  function clampScroll() {
    if (window.scrollY > limit) window.scrollTo(0, limit);
  }

  window.addEventListener('resize', () => {
    limit = stopAt();
    clampScroll();
  });
  window.addEventListener('scroll', clampScroll, { passive: true });
  window.addEventListener('wheel', (event) => {
    if (window.scrollY >= limit && event.deltaY > 0) {
      event.preventDefault();
    }
  }, { passive: false });
  window.addEventListener('touchmove', () => {
    if (window.scrollY > limit) window.scrollTo(0, limit);
  }, { passive: true });
})();
</script>

  let signalStopTimer = null;
  function setCrossingSignals(active) {
    crossingSignalImages.forEach((img, index) => {
      const source = active ? crossingSignalBlinkSources[index] : crossingSignalOffSources[index];
      if (source) img.src = source;
    });
  }
  setCrossingSignals(false);

  function sendBulletTrain() {
    const motion = document.getElementById('bullet-train-motion');
    const train = document.getElementById('bullet-train');
    const art = document.getElementById('bullet-train-art');
    if (!motion || !train || !art) return;

    // Randomly choose a track on every pass.
    const useUpperTrack = Math.random() < 0.5;
    const duration = '2.2s';
    motion.setAttribute('dur', duration);

    if (useUpperTrack) {
      // Upper track: face left and travel right-to-left.
      art.setAttribute('transform', 'translate(988 -68) scale(-3.48 3.48)');
      motion.setAttribute('from', '4200 0');
      motion.setAttribute('to', '-4200 0');
    } else {
      // Lower track: face right and travel left-to-right.
      art.setAttribute('transform', 'translate(0 27) scale(3.48 3.48)');
      motion.setAttribute('from', '-4200 0');
      motion.setAttribute('to', '4200 0');
    }

    train.setAttribute('opacity', '1');

    // Hide at the animation's end before its transform can snap back.
    const hideTrain = () => train.setAttribute('opacity', '0');
    motion.addEventListener('endEvent', hideTrain, { once: true });
    try {
      motion.beginElement();
    } catch (_) {
      hideTrain();
      return;
    }
    window.setTimeout(hideTrain, 2400);
  }

  function playTrainHorn() {
    if (!audioContext || audioContext.state !== 'running') return;

    // Flash from the start of the horn until the train completes its 2.2-second pass.
    setCrossingSignals(true);
    if (signalStopTimer !== null) window.clearTimeout(signalStopTimer);
    signalStopTimer = window.setTimeout(() => {
      setCrossingSignals(false);
      signalStopTimer = null;
    }, 7200);

    // The bullet train rushes through five seconds after every horn blast.
    window.setTimeout(sendBulletTrain, 5000);
    const now = audioContext.currentTime;
    const master = audioContext.createGain();
    const compressor = audioContext.createDynamicsCompressor();
    const filter = audioContext.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2100, now);
    filter.Q.setValueAtTime(0.7, now);
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.62, now + 0.28);
    master.gain.setValueAtTime(0.62, now + 3.0);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);
    compressor.threshold.setValueAtTime(-18, now);
    compressor.knee.setValueAtTime(18, now);
    compressor.ratio.setValueAtTime(5, now);
    compressor.attack.setValueAtTime(0.008, now);
    compressor.release.setValueAtTime(0.22, now);
    filter.connect(master);
    master.connect(compressor);
    compressor.connect(audioContext.destination);

    // Layered, low-to-high chord for a fuller, more locomotive-like blast.
    const notes = [110, 138.59, 164.81, 207.65, 220];
    notes.forEach((frequency, index) => {
      const oscillator = audioContext.createOscillator();
      const voice = audioContext.createGain();
      oscillator.type = index < 3 ? 'sawtooth' : 'triangle';
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.detune.setValueAtTime(index % 2 ? -5 : 5, now);
      voice.gain.setValueAtTime(index < 3 ? 0.22 : 0.15, now);
      oscillator.connect(voice);
      voice.connect(filter);
      oscillator.start(now);
      oscillator.stop(now + 3.85);
    });
    window.setTimeout(() => {
      filter.disconnect(); master.disconnect(); compressor.disconnect();
    }, 4200);
  }

  async function unlockAudio() {
    if (unlocked) return;
    audioContext = audioContext || new AudioContextClass();
    try {
      await audioContext.resume();
      if (audioContext.state !== 'running') return;
      unlocked = true;
      playTrainHorn();
      if (!timerStarted) {
        timerStarted = true;
        window.setInterval(playTrainHorn, 30000);
      }
      window.removeEventListener('pointerdown', unlockAudio);
      window.removeEventListener('keydown', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
    } catch (_) {
      // A later user interaction can retry if the browser blocks audio.
    }
  }

  // Try on page load. Browsers that block autoplay unlock on the first interaction
  // anywhere on the page; no extra button is shown.
  audioContext = new AudioContextClass();
  unlockAudio();
  window.addEventListener('pointerdown', unlockAudio, { once: true });
  window.addEventListener('keydown', unlockAudio, { once: true });
  window.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
})();
</script>
</body>
</html>
